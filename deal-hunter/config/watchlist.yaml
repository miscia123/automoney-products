# Cosa cercare. Ogni voce gira su tutte le sorgenti "a ricerca" (Subito, Vinted, eBay,
# Catawiki, Wallapop, Buyee, LiveAuctioneers) salvo "sources" / "exclude_sources".
# Le sorgenti "a catalogo" (Affide, Zoll-Auktion, vendite giudiziarie) scaricano tutto
# il catalogo dei preziosi e non usano questa lista.
#
# Campi: q (testo), category (watch, gold, jewelry, bullion_coin, coin, card, bag, art,
# wine, collectible), min_price / max_price in EUR (scarta il rumore: cinturini,
# scatole vuote, repliche a 50 €), ja/de/en (traduzioni per Buyee e siti esteri).

